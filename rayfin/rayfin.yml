id: ai-usage-demo
name: ai-usage-demo
version: 1.0.11
services:
  auth:
    enabled: true
    customClaims:
      app_version: 1.0.0
    scopes:
      - read:data
      - write:data
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://rival-ashen-71877b2d36-northcentralus.webapp.fabricapps.net
    fabric:
      enabled: true
      externalEntraExchange: true
  data:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    auth:
      type: application
    buildCommand: npm run build
  storage:
    enabled: false
